name: Backend regression and schema checks
on:
  push:
    paths:
      - 'services/api/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'services/api/**'
      - '.github/workflows/backend.yml'
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements-test.txt
      - name: Install OCR support and test fonts
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra fonts-dejavu-core
      - name: Install backend dependencies
        working-directory: services/api
        run: python -m pip install -r requirements-test.txt
      - name: Run backend tests
        working-directory: services/api
        run: python -m pytest -q
      - name: Validate MySQL schema compilation (offline)
        working-directory: services/api
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite://
          JWT_SECRET: 1234567890123456789012345678901234567890
        run: python -m scripts.check_mysql_ddl_v18
